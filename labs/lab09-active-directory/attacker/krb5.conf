[libdefaults]
    default_realm = NORTHWIND.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false

[realms]
    NORTHWIND.LOCAL = {
        kdc = dc01.northwind.local
        admin_server = dc01.northwind.local
    }

[domain_realm]
    .northwind.local = NORTHWIND.LOCAL
    northwind.local = NORTHWIND.LOCAL
